<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t">
<title id="t">A scored round sourdough loaf cooling on a wire rack</title>
<rect width="320" height="200" fill="#fdf7ee"/>

<!-- rack -->
<g stroke="#c9b394" stroke-width="3" stroke-linecap="round">
  <line x1="44" y1="166" x2="276" y2="166"/>
  <line x1="60" y1="166" x2="60" y2="180"/>
  <line x1="260" y1="166" x2="260" y2="180"/>
  <line x1="52" y1="180" x2="268" y2="180"/>
</g>
<g stroke="#ddd0b8" stroke-width="2">
  <line x1="70" y1="158" x2="70" y2="166"/>
  <line x1="95" y1="152" x2="95" y2="166"/>
  <line x1="120" y1="149" x2="120" y2="166"/>
  <line x1="145" y1="148" x2="145" y2="166"/>
  <line x1="170" y1="148" x2="170" y2="166"/>
  <line x1="195" y1="149" x2="195" y2="166"/>
  <line x1="220" y1="152" x2="220" y2="166"/>
  <line x1="245" y1="158" x2="245" y2="166"/>
</g>

<!-- loaf -->
<path d="M52 166 Q46 118 80 92 Q118 62 160 62 Q202 62 240 92 Q274 118 268 166 Z" fill="#c98a4d" stroke="#8a5223" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M52 166 Q46 128 70 108 Q120 142 250 108 Q274 128 268 166 Z" fill="#b5763c" opacity="0.45"/>

<!-- ear: the lifted flap along the score -->
<path d="M96 104 Q140 76 196 86 Q212 90 216 100 Q176 84 128 104 Q108 112 96 104 Z" fill="#f0d9b4" stroke="#8a5223" stroke-width="3" stroke-linejoin="round"/>

<!-- flour dusting -->
<g fill="#fdf7ee" opacity="0.6">
  <circle cx="110" cy="86" r="3"/>
  <circle cx="142" cy="76" r="2.4"/>
  <circle cx="176" cy="74" r="2.8"/>
  <circle cx="206" cy="84" r="2.2"/>
  <circle cx="86" cy="104" r="2.4"/>
  <circle cx="232" cy="102" r="2.6"/>
  <circle cx="160" cy="120" r="2.2"/>
  <circle cx="196" cy="128" r="2"/>
  <circle cx="124" cy="130" r="2.4"/>
</g>

<!-- steam -->
<g fill="none" stroke="#d9c6a6" stroke-width="2.5" stroke-linecap="round">
  <path d="M124 48 q7 -12 0 -22"/>
  <path d="M160 40 q8 -14 0 -26"/>
  <path d="M196 48 q7 -12 0 -22"/>
</g>
</svg>
