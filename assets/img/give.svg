<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t">
<title id="t">Two open hands offering a loaf of bread, with a heart above</title>
<rect width="320" height="200" fill="#fdf7ee"/>

<!-- heart -->
<path d="M160 44 q-9 -14 -21 -7 q-11 7 -5 20 q5 11 26 25 q21 -14 26 -25 q6 -13 -5 -20 q-12 -7 -21 7 z" fill="#c9743b"/>

<!-- crumbs / warmth marks -->
<g fill="#e0cdb0">
  <circle cx="112" cy="54" r="3"/>
  <circle cx="208" cy="54" r="3"/>
  <circle cx="98" cy="76" r="2.4"/>
  <circle cx="222" cy="76" r="2.4"/>
</g>

<!-- loaf -->
<path d="M96 146 Q92 114 118 100 Q138 88 160 88 Q182 88 202 100 Q228 114 224 146 Z" fill="#c98a4d" stroke="#8a5223" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M96 146 Q92 122 108 110 Q142 132 212 110 Q228 122 224 146 Z" fill="#b5763c" opacity="0.4"/>
<!-- score -->
<path d="M124 110 Q160 96 196 106 Q172 100 136 114 Z" fill="#f0d9b4" stroke="#8a5223" stroke-width="2.6" stroke-linejoin="round"/>

<!-- hands, cupped underneath -->
<path d="M84 150 Q70 150 64 160 Q58 170 66 176 L100 176 Z" fill="#f0dfc0" stroke="#9a5f2e" stroke-width="3" stroke-linejoin="round"/>
<path d="M236 150 Q250 150 256 160 Q262 170 254 176 L220 176 Z" fill="#f0dfc0" stroke="#9a5f2e" stroke-width="3" stroke-linejoin="round"/>
<path d="M66 176 Q104 190 160 190 Q216 190 254 176 Q220 166 160 166 Q100 166 66 176 Z" fill="#f6ebd6" stroke="#9a5f2e" stroke-width="3" stroke-linejoin="round"/>
<!-- fingers -->
<g stroke="#d9c6a6" stroke-width="2.2" stroke-linecap="round">
  <path d="M112 178 l0 8"/>
  <path d="M136 181 l0 8"/>
  <path d="M160 182 l0 8"/>
  <path d="M184 181 l0 8"/>
  <path d="M208 178 l0 8"/>
</g>
</svg>
