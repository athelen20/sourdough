<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t">
<title id="t">A bowl of sourdough discard with a whisk, a stack of pancakes and crackers</title>
<rect width="320" height="200" fill="#fdf7ee"/>

<!-- bowl of discard -->
<path d="M18 112 h104 a0 0 0 0 1 0 0 a52 44 0 0 1 -104 0 z" fill="#fffdf9" stroke="#9a5f2e" stroke-width="3"/>
<ellipse cx="70" cy="112" rx="52" ry="12" fill="#f0dfc0" stroke="#9a5f2e" stroke-width="3"/>
<!-- whisk -->
<g stroke="#bfb3a0" stroke-width="3" fill="none" stroke-linecap="round">
  <path d="M96 104 l16 -46"/>
  <path d="M92 100 q14 -26 20 -42"/>
  <path d="M100 104 q16 -24 12 -42"/>
</g>
<rect x="106" y="44" width="10" height="24" rx="5" fill="#9a5f2e" transform="rotate(20 111 56)"/>

<!-- pancake stack -->
<g stroke="#8a5223" stroke-width="2.6">
  <ellipse cx="192" cy="150" rx="46" ry="13" fill="#d9a263"/>
  <ellipse cx="192" cy="136" rx="44" ry="12.5" fill="#e0b071"/>
  <ellipse cx="192" cy="123" rx="42" ry="12" fill="#d9a263"/>
</g>
<!-- butter -->
<path d="M180 112 h22 l-4 9 h-22 z" fill="#f4dc8e" stroke="#d4b955" stroke-width="2" stroke-linejoin="round"/>
<!-- syrup drip -->
<path d="M160 124 q-6 10 -2 20" fill="none" stroke="#b5763c" stroke-width="3.5" stroke-linecap="round"/>

<!-- crackers -->
<g fill="#e8d2a6" stroke="#c2a677" stroke-width="2.2" stroke-linejoin="round">
  <rect x="252" y="62" width="34" height="34" rx="4" transform="rotate(-12 269 79)"/>
  <rect x="268" y="84" width="34" height="34" rx="4" transform="rotate(9 285 101)"/>
</g>
<g fill="#c2a677">
  <circle cx="269" cy="79" r="2.4"/>
  <circle cx="285" cy="101" r="2.4"/>
</g>
</svg>
